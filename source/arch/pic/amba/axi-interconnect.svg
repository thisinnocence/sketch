<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="514" viewBox="0 0 1010 514" role="img" aria-labelledby="title">
<title id="title">AXI crossbar functional blocks and transaction paths</title>
<style>
text { font: 17px system-ui, sans-serif; text-anchor: middle; fill: #19334f }
.bold { font-weight: 650 } .heading { font-size: 24px; font-weight: 700 } .small { font-size: 15px }
rect { stroke-width: 1.5 }
.fabric { fill: #fcf7ea; stroke: #d4a243 }
.source { fill: #e9f2ff; stroke: #5c91ce }
.target { fill: #e6f5ec; stroke: #63a280 }
.buffer { fill: #f1eafa; stroke: #9b79bd }
.decode { fill: #fff0cc; stroke: #d4a243 }
.arb { fill: #fae8ef; stroke: #cb7493 }
.flow,.reply,.select { fill: none; stroke-width: 2; stroke-linejoin: round }
.flow { stroke: #395979 } .reply { stroke: #7547a9 } .select { stroke: #267260; stroke-dasharray: 5 4 }
</style>
