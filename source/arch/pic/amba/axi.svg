<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 232" width="600" height="232" role="img">
  <title>AXI transaction paths</title>
  <style>
    rect { fill: #eaf3ff; stroke: #5e7da3; stroke-width: 1.4 }
    text { font: 16px system-ui, sans-serif; fill: #19334f; text-anchor: middle }
    path { stroke: #47698f; stroke-width: 1.6; fill: none }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#47698f"/>
    </marker>
  </defs>
  <rect width="600" height="232" rx="9" style="fill:#f8fbff;stroke:none"/>
  <rect x="16" y="16" width="120" height="200" rx="7"/><text x="76.0" y="121.0">Manager</text>
  <rect x="464" y="16" width="120" height="200" rx="7"/><text x="524.0" y="121.0">Subordinate</text>
  <path d="M138 49 L462 49" marker-end="url(#arrow)"/><text x="300.0" y="41.0">AR · Read Address</text>
  <path d="M462 87 L138 87" marker-end="url(#arrow)"/><text x="300.0" y="79.0">R · Read Data</text>
  <path d="M138 125 L462 125" marker-end="url(#arrow)"/><text x="300.0" y="117.0">AW · Write Address</text>
  <path d="M138 163 L462 163" marker-end="url(#arrow)"/><text x="300.0" y="155.0">W · Write Data</text>
  <path d="M462 201 L138 201" marker-end="url(#arrow)"/><text x="300.0" y="193.0">B · Write Response</text>
</svg>
